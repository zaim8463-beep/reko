name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses > /dev/null || true

          "$SDKMANAGER" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Unzip reko.zip
        run: |
          if [ ! -f reko.zip ]; then
            echo "ERROR: reko.zip not found in repository root."
            echo "Repository files:"
            ls -la
            exit 1
          fi

          rm -rf project_src
          mkdir -p project_src

          unzip -o -q reko.zip -d project_src

          echo "Extracted project:"
          find project_src -maxdepth 3 -type f | sort | head -100

      - name: Find Android project
        id: proj
        shell: bash
        run: |
          set -e

          F=$(find project_src -type f \( \
            -name "settings.gradle" \
            -o \
            -name "settings.gradle.kts" \
          \) | head -n 1)

          if [ -z "$F" ]; then
            echo "ERROR: No settings.gradle or settings.gradle.kts found."

            echo "Files inside project_src:"
            find project_src -maxdepth 4 -type f | sort

            exit 1
          fi

          PROJECT_DIR="$(dirname "$F")"

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build Debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          gradle assembleDebug --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HodaScripts-debug
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
